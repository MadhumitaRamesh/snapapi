<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250">
  <!-- Background base -->
  <rect width="800" height="250" fill="#f8fafc" rx="8" />
  
  <!-- Server / Backend node -->
  <rect x="350" y="75" width="100" height="100" rx="12" fill="#4a6cf7" />
  <circle cx="400" cy="125" r="20" fill="#ffffff" opacity="0.8" />
  
  <!-- Lines connecting endpoints -->
  <path d="M450 125 L550 75" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  <path d="M450 125 L550 125" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  <path d="M450 125 L550 175" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
  
  <!-- Endpoint nodes -->
  <rect x="550" y="55" width="120" height="40" rx="6" fill="#e2e8f0" />
  <rect x="550" y="105" width="120" height="40" rx="6" fill="#e2e8f0" />
  <rect x="550" y="155" width="120" height="40" rx="6" fill="#e2e8f0" />
  
  <!-- Client / Frontend side -->
  <path d="M250 125 L350 125" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-dasharray="8 8" />
  <rect x="130" y="95" width="120" height="60" rx="8" fill="#e2e8f0" />
  
  <!-- Dummy Text lines in UI -->
  <rect x="150" y="115" width="80" height="6" rx="3" fill="#94a3b8" />
  <rect x="150" y="130" width="50" height="6" rx="3" fill="#94a3b8" />
</svg>
